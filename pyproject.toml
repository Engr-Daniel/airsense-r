[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense-r"
version = "0.1.0"
description = "Reliability-aware air-quality forecasting under sensor degradation and monitoring-site shift."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Oyewale Daniel Oyewola"}]
dependencies = [
  "numpy==2.1.3", "pandas==2.2.3", "scipy==1.17.1",
  "scikit-learn==1.6.1", "matplotlib==3.10.7", "PyYAML==6.0.3",
  "requests==2.34.2", "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
train = ["tensorflow==2.20.0", "keras==3.11.3", "xgboost==3.0.5", "h5py==3.16.0"]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
